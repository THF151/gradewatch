name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  schedule:
    - cron: "20 22 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: ${{ matrix.check }}
    if: github.repository == 'THF151/gradewatch' && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: gharp-public-rust-${{ matrix.cpu }}cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            cpu: 1
          - check: clippy
            cpu: 2
          - check: build
            cpu: 2
          - check: test
            cpu: 2
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore local Cargo target snapshot
        run: GITHUB_JOB="$GITHUB_JOB-$CHECK" runner-target-cache restore "$GITHUB_WORKSPACE/target"
      - name: Run check
        shell: bash
        run: |
          case "$CHECK" in
            lint) make fmt-check check ;;
            clippy) make clippy ;;
            build) make build ;;
            test) make test ;;
            *) exit 1 ;;
          esac
      - name: Save local Cargo target snapshot
        run: GITHUB_JOB="$GITHUB_JOB-$CHECK" runner-target-cache save "$GITHUB_WORKSPACE/target"

  package:
    name: package
    needs: checks
    if: github.event_name != 'schedule'
    runs-on: gharp-public-rust-4cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compute image name
        id: registry
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile and stage both static binaries
        run: bash ci/cross-package.sh
      - name: Smoke-test both binaries
        run: |
          bash ci/smoke-package.sh "$RUNNER_TEMP/gradewatch-package/amd64/gradewatch" amd64
          bash ci/smoke-package.sh "$RUNNER_TEMP/gradewatch-package/arm64/gradewatch" arm64
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Assemble both images
        id: image
        uses: docker/build-push-action@v6
        with:
          builder: job
          context: ${{ runner.temp }}/gradewatch-package
          file: ./Dockerfile.package
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUBLISH == 'false' && format('type=oci,dest={0}/gradewatch.oci.tar', runner.temp) || '' }}
      - name: Validate package platforms
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          if [[ "$PUBLISH" == true ]]; then
            docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" | python3 ci/verify-package.py -
          else
            python3 ci/verify-package.py "$RUNNER_TEMP/gradewatch.oci.tar"
          fi
      - name: Save local Cargo target snapshot
        run: RUSTUP_TOOLCHAIN=1.99.1 runner-target-cache save "$GITHUB_WORKSPACE/target"

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.repository == 'THF151/gradewatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: gharp-public-rust-4cpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ vars.GRADEWATCH_CODEQL_UPLOAD == 'true' && 'always' || 'never' }}
